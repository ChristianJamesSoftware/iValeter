name: Promote Staging to Production

# Runs every night at 11pm UK time (23:00 BST = 22:00 UTC)
# Only merges if staging has new commits that aren't in main
on:
  schedule:
    - cron: '0 22 * * *'  # 22:00 UTC = 23:00 BST / 11pm UK
  workflow_dispatch:        # Can also be triggered manually

jobs:
  promote:
    name: Merge staging → main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RAILWAY_TOKEN }}

      - name: Check if staging is ahead of main
        id: check
        run: |
          git fetch origin
          STAGING=$(git rev-parse origin/staging)
          MAIN=$(git rev-parse origin/main)
          if [ "$STAGING" = "$MAIN" ]; then
            echo "ahead=false" >> $GITHUB_OUTPUT
            echo "Staging is up to date with main — nothing to promote"
          else
            echo "ahead=true" >> $GITHUB_OUTPUT
            echo "Staging has new commits — promoting to production"
          fi

      - name: Merge staging into main
        if: steps.check.outputs.ahead == 'true'
        run: |
          git config user.email "deploy@ivaleter.co.uk"
          git config user.name "iValeter Deploy"
          git checkout main
          git merge origin/staging --no-edit -m "chore: promote staging to production [$(date '+%Y-%m-%d %H:%M')]"
          git push origin main
          echo "✅ Staging promoted to production"

      - name: Skip (no changes)
        if: steps.check.outputs.ahead == 'false'
        run: echo "✅ Nothing to promote — staging and production are in sync"
